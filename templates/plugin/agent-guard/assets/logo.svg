<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Shield Inner Fill -->
    <linearGradient id="innerShieldGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Protective Hex Ring -->
  <polygon points="256,42 428,141 428,340 256,439 84,340 84,141" 
           fill="none" 
           stroke="#1e293b" 
           stroke-width="2" 
           stroke-dasharray="8 8" />

  <!-- Outer Shield Glow -->
  <path d="M 256,70 
           L 410,132 
           C 410,265 352,370 256,436 
           C 160,370 102,265 102,132 
           Z" 
        fill="none" 
        stroke="url(#cyanGlow)" 
        stroke-width="6" 
        filter="url(#glow)" 
        opacity="0.6" />

  <!-- Shield Base Body -->
  <path d="M 256,76 
           L 404,136 
           C 404,261 348,362 256,426 
           C 164,362 108,261 108,136 
           Z" 
        fill="url(#innerShieldGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="4" />

  <!-- Inner Circuit Grid & Energy Conduits -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.35" fill="none">
    <!-- Top Central Conduit -->
    <path d="M 256,76 L 256,170" />
    <path d="M 256,170 L 196,210 L 196,260" />
    <path d="M 256,170 L 316,210 L 316,260" />
    
    <!-- Diagonal Shield Accents -->
    <path d="M 160,157 L 220,197" />
    <path d="M 352,157 L 292,197" />
    
    <!-- Base Convergence -->
    <path d="M 196,260 L 256,330 L 316,260" />
    <path d="M 256,330 L 256,400" />
  </g>

  <!-- Sentinel Node Nodes -->
  <circle cx="196" cy="210" r="4" fill="#38bdf8" filter="url(#softGlow)" />
  <circle cx="316" cy="210" r="4" fill="#38bdf8" filter="url(#softGlow)" />
  <circle cx="196" cy="260" r="4" fill="#38bdf8" filter="url(#softGlow)" />
  <circle cx="316" cy="260" r="4" fill="#38bdf8" filter="url(#softGlow)" />

  <!-- Central Sentinel Eye / Core Shield Prism -->
  <g transform="translate(256, 245)">
    <!-- Outer Core Diamond -->
    <polygon points="0,-52 52,0 0,52 -52,0" 
             fill="#0f172a" 
             stroke="url(#cyanGlow)" 
             stroke-width="3" 
             filter="url(#softGlow)" />

    <!-- Inner Core Diamond -->
    <polygon points="0,-34 34,0 0,34 -34,0" 
             fill="#1e293b" 
             stroke="#38bdf8" 
             stroke-width="2" />

    <!-- Center Sentinel Node -->
    <circle cx="0" cy="0" r="14" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="0" cy="0" r="7" fill="#f0f9ff" />
  </g>

  <!-- Horizontal Scanline Beam -->
  <line x1="140" y1="245" x2="372" y2="245" 
        stroke="url(#cyanGlow)" 
        stroke-width="1.5" 
        opacity="0.5" 
        stroke-dasharray="12 6" />
</svg>
